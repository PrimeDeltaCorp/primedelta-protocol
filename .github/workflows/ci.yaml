name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FOUNDRY_PROFILE: default

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # lib/dclex-blockchain is a private PrimeDeltaCorp repo, so the default
      # GITHUB_TOKEN cannot fetch it. SUBMODULE_TOKEN must be a PAT (or app
      # token) with read access to it. Without the secret this step fails
      # loudly rather than skipping the submodule and building against nothing.
      - name: Fetch submodules
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          if [ -z "$SUBMODULE_TOKEN" ]; then
            echo "::error::SUBMODULE_TOKEN is not set — lib/dclex-blockchain is private and cannot be fetched."
            exit 1
          fi
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show versions
        run: forge --version

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vv

      - name: Check formatting
        run: forge fmt --check
        continue-on-error: true
